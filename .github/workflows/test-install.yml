name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Upgrade npm
        run: npm install -g "npm@>=12.0.0-pre.0.0"

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: check for byte-identical duplicate images
        run: node scripts/check-duplicate-assets.mjs

      - name: enforce image size/dimension budget on changed files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.png' '*.jpg' '*.jpeg' '*.webp' '*.avif' '*.gif')
          if [ -n "$changed" ]; then
            node scripts/check-image-budget.mjs $changed
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Upgrade npm
        run: npm install -g "npm@>=12.0.0-pre.0.0"

      - name: Install dependencies
        run: npm ci

      - name: build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build

      - name: enforce client JS chunk size budget
        run: node scripts/check-chunk-budget.mjs
